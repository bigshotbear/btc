services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btc_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btc_engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    command: python -m btc_engine.worker
    volumes:
      - raw_data:/data/raw
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    command: uvicorn btc_engine.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  raw_data:
