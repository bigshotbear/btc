[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-btc-engine"
version = "0.1.0"
description = "Read-only Phase 1 data foundation for Kalshi BTC 15-minute research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Connor / OpenAI"}]
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<17"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1"
]

[project.scripts]
btc-engine-worker = "btc_engine.worker:main"
btc-engine-api = "btc_engine.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
